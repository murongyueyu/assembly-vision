tray:
  size:
  - 160.0
  - 160.0
  thickness: 10.0
  pocket_depth: 2.0
  flip_x: false
  flip_y: false
slots:
- id: slot_wheel
  part: P3_wheel
  type: circle
  center:
  - 28.6
  - 49.5
  diameter: 75.0
  roi_margin_mm: 3.0
- id: slot_column
  part: P2_column
  type: capsule
  center:
  - 108.2
  - 43.7
  length: 91.0
  width: 28.0
  angle_deg: -44.0
  roi_margin_mm: 4.0
- id: slot_cap
  part: P4_cap
  type: circle
  center:
  - 28.0
  - 128.8
  diameter: 25.0
  roi_margin_mm: 3.0
- id: slot_base
  part: P1_base
  type: circle
  center:
  - 114.5
  - 129.4
  diameter: 65.0
  roi_margin_mm: 3.0
parts:
  P1_base:
    name: 底座圆盘
    expect: 1
  P2_column:
    name: 立柱
    expect: 1
  P3_wheel:
    name: 轮盘组件
    expect: 1
    spokes: 8
  P4_cap:
    name: 顶盖铭牌
    expect: 1
assembly:
  enabled: true
  center:
  - -65.0
  - 80.0
  radius: 45.0
  radii_mm:
    outer: 37.2
    spoke_band:
    - 12.0
    - 24.0
    # ★ 装配体上数辐条用的半径带。实测（真机帧，见 AGENTS.md 2.13）：
    #   30~35mm 带用 **metal 掩膜** -> **8 峰、角度抖动仅 5.9°**（真的 8 辐条）
    #   峰角度实测 [5.5, 57.5, 98.5, 134.8, 176.5, 219.5, 262.0, 310.0]
    #   间隔 52/41/36/42/43/43/48/56° -> 平均 ~45° ✓
    #   ★ 原来写的是 33~37.5mm（当假设值填的，从没验证过），
    #     而球头最外沿只到 ~37mm，33~37.5 落在外圈环上 -> 数不出 8 峰。
    #   ★ 必须配 metal 掩膜：用 brass 掩膜时球头被 h_max=45 挡掉。
    spoke_band_outer:
    - 30.0
    - 35.0
    ring_band:
    - 26.0
    - 30.0
    hub: 13.0
    cap: 12.5
    center_plug: 6.0
  baseline:
    wheel_height_mm: null
    base_height_mm: 5.0
    spoke_peak_count: 8
    ring_coverage: null
    hub_coverage: null
  stereo_baseline_mm: 125.7
segment:
  background: green
  work_roi_margin_mm: 25.0
  # ★ 金属掩膜（不靠色相）：判据 = "亮 + 不是绿垫"。
  #   为什么需要（c5 实测踩过，见 AGENTS.md 2.13）：
  #     装配体上的**球头只有 Ø5mm**，在 0.86mm/px 下只有 6 像素宽，
  #     边缘与绿垫抗锯齿混色后色相从黄铜的 H=30 跳到 **H=59**（被绿垫染成淡绿），
  #     于是被 brass 的 `h_max=45` 整条挡掉 -> 装配位上辐条一个都数不出来。
  #   实测同一帧对比：
  #     brass 掩膜在 28mm 处 8 峰但角度抖 33°（凑出来的）
  #     metal 掩膜在 30~35mm 带 8 峰、角度抖 **5.9°**（真的）
  #   ★ 必须配 v_min：木桌/皮肤也是"非绿"，光看非绿会把桌子算进来；
  #     外层还有 work_roi 兜着（位置即身份）。
  metal:
    enabled: true
    v_min: 150        # 实测金属球头 V 中值 222；木桌的暗部被这条挡住
    # ★★ s_max 是必须的（实测踩过，曾漏掉导致木桌被判成金属）：
    #   只判"非绿"会把木桌放进来 —— 实测木桌 H=19、S=122、V=210，
    #   色相不在绿垫区间里，于是被当成"非绿"= 金属，
    #   顶部木桌区 metal 占比高达 99.9%，辐条扫优整个失效。
    #   依据：黄铜 S 实测 ≤109，绿垫 S≈255、木桌 S≈122 —— 分界干净。
    #   ★ 实测扫描（同一帧，木桌区 metal 占比 vs 30~35mm 峰数）：
    #       s_max   木桌区    30~35mm
    #       200     99.9%    8峰 抖5.9°
    #       140     99.3%    8峰 抖5.9°
    #       120     44.6%    8峰 抖5.9°
    #       100     15.2%    8峰 抖6.0°   <- 采用：木桌降 6 倍，8 峰不掉
    #     取 130 会让木桌区仍有 79.7%，取 100 才真正压住。
    #   ★ 注意：木桌最终是靠 work_roi **几何**挡掉的（位置即身份），
    #     s_max 只是第二道防线 —— 不要把安全性全押在颜色上。
    s_max: 100
    green_h_min: 60   # 绿垫色相区间（实测绿垫 H 中值 83、p2~p98 = [79,95]）
    green_h_max: 100
    green_s_min: 120  # 绿垫 S≈255；低饱和的灰绿不算垫子
  brass:
    h_min: 10
    h_max: 45
    s_min: 50
    s_max: 180
    v_min: 80
    morph_open: 3
    morph_close: 5
    min_area_px: 500
  glove:
    # ★★ h_min 从 95 收到 **91** —— 实测依据（`tools/measure_glove_gamut.py`）：
    #     手套自身的 H 分布是 **p10 90 / 中位 94 / p90 95**，
    #     原来的 `h_min: 95` **把一半手套切掉了**（连通块只剩 3219px）。
    #     而画面里有一块 150211px 的**偏青蓝**（`now_raw.png`，H 85~88、S 182、V 255）
    #     —— 原来的 95 恰好把它挡在外面，属于"**刚好卡住**"，不是有余量。
    #     精确扫描 h_min（s>=80 v>=130，配 morph_close=21 与面积闸门）：
    #        88 -> 误检 29282px    89 -> 误检 2301px
    #        **90 起误检为 0**（手套保留 22535px；95 时只有 3219px）
    #     -> 取 **91**，在安全边界上留 1 的余量。
    h_min: 91
    h_max: 130
    # s_min 保持 80：手套 S 的 p10 是 160，余量充足，不必放宽
    s_min: 80
    # ★ v_min 的关键作用：键盘背光/屏幕与手套的**色相完全重叠**（AGENTS 2.3），
    #   只能靠亮度下限分开。实测扫描：v_min=110 时空场景最大蓝块 7882px（会过闸门），
    #   v_min=130 时降到 1230px（且真手套只损失 4%）。**不要调低。**
    v_min: 130
    morph_open: 3
    # ★★ morph_close 必须够大，否则**手指会碎成多块**（实测踩过）：
    #   用户手搭在料盘上时，640x480 下的连通域是
    #       [(613,1.33), (502,2.04), (383,1.29), (278,1.27)]   <- 碎成 4~5 块
    #   而 morph_close=5 时仍是 4 块、最大块只有 638px -> 被 min_area_px 整只滤掉
    #   -> glove_bbox=None -> 界面显示「手: 无」（但 glove_mask 仍在，
    #      所以**遮挡判定一直是对的**，只有显示受影响）。
    #   扫描：9 -> 最大块 2225；15 -> 2629；**21 -> 3219（连成一块）**；31 -> 6399（连过头）
    morph_close: 21
    # ★ min_area_px 从 3000 降到 2000，配合上面的闭运算：
    #   有手时最大块 3219（是闸门的 1.6 倍，留足余量）；
    #   6 个无手真机帧的未过滤最大蓝块**全部 = 0px**，所以 2000 仍绰绰有余。
    #   （3000 这个值原本是按"整只手占大半画面"定的 —— 那时真手套 83316px，
    #    而今用法变成了"几根手指搭在料盘上"，量级完全不同。）
    min_area_px: 2000
    max_area_px: 200000
    max_aspect: 6.0
# ══════════════════════════════════════════════════════════════
# 零件追踪（tools/part_track_demo.py 与 pipeline 共用）
#   ★ 为什么需要：实测 640×480 全图分割 **9.88ms（PC）/ ≈59ms（树莓派 4B）**
#     也就是 Pi 上"每帧全分割"最多 17fps。而追踪器 update 只要
#     **MOSSE 0.25ms / KCF 2.0ms**（Pi 估 2 / 12ms）。
#     -> 检测 + 追踪：每 N 帧才全图分割，中间帧靠追踪器，帧率就上去了。
# ══════════════════════════════════════════════════════════════
tracking:
  # 追踪后端。★★ **实测只有 kcf 可靠**（见 docs/踩坑实录.md 2.21）：
  #   kcf         5.5ms/目标  ★ **唯一可靠**，默认
  #   mosse       0.02ms      ✗ `update` **恒返回 False**（实测 40/40 全"丢"）
  #   medianflow  1.8ms       ✗ 崩：lkpyramid 要求前后帧尺寸一致
  #   csrt       22.7ms       ✗ 太慢（Pi 估 136ms）
  #   ★ 别按"耗时最短"选 —— 之前写"Pi 推荐 mosse"就是**没验过**的推测，已更正。
  backend: kcf
  # 每 N 帧做一次全图检测；其余帧只跑追踪。
  # ★ 实测（真机 120 帧）：调大它**几乎不提帧率**（3->26.1 / 5->27.9 / 8->28.1 / 12->29.1 fps），
  #   因为分割早已不是瓶颈（摊薄后仅 0.7~3ms），**瓶颈是 KCF 的每目标固定成本**。
  #   8 是实测最好的一档。
  detect_every_n: 8
  # ★★ 丢失判据 —— 按用户明确定义的语义（别再自己发明）：
  #     「不是持续很久才被怀疑，而是最后一次还检测到有零件的位置的时候，
  #       到**遮挡物已经完全消失了之后的一小段时间（暂定2秒）**还是没有检测到
  #       这个零件，算作这个零件丢失。而且找这个零件是**全图搜索**而不是范围搜索。」
  #   三段逻辑（见 PartTracker.judge_lost）：
  #     ① 遮挡物**还盖着**  -> occluded，**永不判丢**（挡多久都不算，零件没动）
  #     ② 遮挡物**刚移开**  -> 开始计时 lost_grace_frames，期间做**全图搜索**
  #     ③ 窗口过期仍找不到 -> lost；再过 3 倍 -> gone（允许清理）
  #   ★ 实测踩过两种错法：
  #     · 原来 12 帧（0.4 秒）不见就判 lost -> 手搭上半秒就报「丢失」
  #     · 改成「看不见 5 秒才 lost」也是错的 —— 手一直挡着就永远不算丢，
  #       而手移开后应该**很快**（2 秒）就能确定它是不是真没了
  lost_grace_frames: 60
  # 判定「遮挡物是否盖住这个零件」的重叠比例阈值
  cover_overlap_ratio: 0.25
  # 参与追踪的面积闸门（像素）。上台面是 400（滤掉噪声），
  # 上盖是 8000（滤掉木桌那种几万像素的假黄铜）
  min_area_px: 400
  max_area_px: 8000
  # 检测框与已有轨迹的关联阈值
  iou_match: 0.15
  dist_match_px: 40.0
  # ── 遮挡处理（用户要求：「手拿起来就算遮一部分也要能认」）──
  # 实测（tools/part_track_occlusion_test.py）：遮挡 30% 保留 76% 轮廓、
  #   50% 保留 46%、**70% 仍保留 20% 且轮廓形状完整**
  #   -> 遮挡不是"丢了"，而是"面积变小"。分三档处理：
  #     visible >= full_ratio      -> 正常：**重新识别身份**
  #     occluded_ratio <= v < full -> 只更新位置与轮廓，**身份沿用**
  #     v <= occluded_ratio        -> 记 occluded，**冻结身份**（残缺件拿去认必然认错）
  #   ★ 取舍说清楚：遮挡时**不重判身份**是有意的 —— 实测底座被切到
  #     1542mm² 时曾被认成轮盘（§2.19），拿残缺件去认必然出错。
  full_ratio: 0.80
  occluded_ratio: 0.55
  # 面积参考（判断"被遮了多少"）的更新速率与换标签的分数余量
  area_ref_rate: 0.15
  id_margin: 0.12

check:
  coverage_present: 0.45
  coverage_absent: 0.15
  # ★ 覆盖率阈值按槽缩放（coverage_scale_by_max）。
  #   依据：覆盖率 = 零件面积 / 槽面积，**每种零件天生不同** ——
  #     轮盘/底座/顶盖 ~0.95+（圆件填满圆槽）
  #     立柱只有 ~0.19~0.43（细杆 vs 91x28 的宽胶囊槽）
  #   实测算出的缩放系数（max_coverage_for）：
  #     slot_wheel 0.846 -> 阈值 0.380    slot_column 0.426 -> 0.192
  #     slot_cap   0.974 -> 阈值 0.438    slot_base   1.000 -> 0.450
  #   ★ 立柱的余量很薄（实测覆盖率 0.198 vs 阈值 0.192，只差 0.006）——
  #     因为 max_coverage_for 用的是**模板面积**（1074mm²），
  #     而真实分割只切得到高光带（实测 667mm², -38%）。
  #     若立柱再被判"存疑"，优先查这里。
  coverage_scale_by_max: true
  drone_consistency: 2
  spokes:
    required: 8
    r_min_mm: 12.0
    r_max_mm: 24.0
    n_radii: 3
    peak_k_mad: 3.0
    # ★ 与 c5 实测基线（assembly.spoke_peak_count）比较时的容差。
    #   依据：c5 真机实测 12 帧辐条数为 [8,8,8,8,6,6,7,8,8,6,8,8] ——
    #   **完整在位就是 6~8，散布 ±1**。所以取 2：只有少 2 根以上才报。
    #   ★ 代价（明确写下）：真的少 2 根辐条（数出 6）**不会被发现**，
    #     因为"完整在位"本身就出现过 6。这是"不误报"优先于"不漏报"的取舍。
    #     要收紧就调成 1，但会与本项目的实测散布直接冲突。
    baseline_slack: 2
    min_peak_width_deg: 6.0
    # ★★ 怎么从多个半径带里得出辐条数（真机实测踩过**假 NG**，别改回 vote）。
    #   实测（真机装配体，30~35mm 切成 3 个带，每带仅 1.67mm ≈ 1.9px）：
    #     带(mm)        med    p95-med  阈值    峰数
    #     30.0~31.7    0.000   1.000   0.600    8   <- ★ 球头只落在最内侧这个带
    #     31.7~33.3    0.000   1.000   0.600    6
    #     33.3~35.0    0.000   1.000   0.600    5
    #     -> 计数 [8,6,5] 三个全不同、**没有众数** -> 并列取较小值 -> **5**
    #     -> `5 < required(8)` -> **明明装好的轮盘被判"缺辐条"**
    #   而同一帧**整条 30~35mm 一次数**（c5 的做法）是 8 峰、抖动 5.9°。
    #   ★ 球头只有 Ø5mm（0.86mm/px 下约 6px），落进哪个子带是碰运气；
    #     但**真辐条的角度是均布的**，所以按"角度均匀度"挑带远比比投票可靠。
    #   uniform -> 在「各子带 + 整条带」里挑抖动最小的（实测 8 峰、抖动 6.2°）
    #   vote    -> 老行为（众数 + 并列取小），保留以便对比与回退
    select: uniform
    # 挑带时认为"还算规整"的抖动上限。全部候选都超过它就退回"峰最多"那个，
    # 让真缺陷被如实报出来，而不是因为我们挑剔就报成 0。
    max_jitter_deg: 15.0
  column:
    # ★ 立柱形状检查（_check_column_shape）。立柱是**弯曲+锥形+台阶**的机加工件
    #   （不是圆柱），所以这两个阈值要留足余量：
    #   aspect_min=3.0：实测细长比 4.74~5.04（远高于 3.0，安全）
    #   min_length_mm=40：实测最长边约 51mm（安全）
    aspect_min: 3.0
    min_length_mm: 40.0
    wheel_height_tol_mm: 15.0
  unsupported:
  - 顶盖是否拧紧（行程 1-2 mm，与深度噪声同量级）
  - 螺纹牙、小于 1 mm 的划痕与毛刺（受 GSD 限制）
  - 底座与工件内部结构（俯视不可见）

# ── 零件识别（旋转不变特征向量，见 assemvision/core/part_id.py）──
# ★ 这个键以前**不在配置里**，代码靠 get(..., 0.55) 的默认值兜着 ——
#   能跑但"配置里没有"会让排查时误以为配置写错了。补上并写清依据。
part_id:
  # 识别得分门槛。低于它就判"认不出"（**宁可认不出，也不瞎猜**）。
  #   实测得分：轮盘 0.74~1.00、立柱 0.70~1.00、顶盖 0.73~1.00、底座 0.80~1.00
  #   取 0.55 留足余量；调高会漏认，调低会误认。
  min_score: 0.55
operations:
- id: op1
  name: 放置底座圆盘
  pre: []
  eff:
  - base_present
  prompt: 请将底座圆盘放入槽位并放上装配位
- id: op2
  name: 立柱旋入底座
  pre:
  - base_present
  eff:
  - column_present
  prompt: 请将立柱旋入底座中心孔
- id: op3
  name: 轮盘套上立柱
  pre:
  - column_present
  eff:
  - wheel_present
  prompt: 请将轮盘组件套到立柱上
- id: op4
  name: 顶盖旋入拧紧
  pre:
  - column_present
  - wheel_present
  eff:
  - cap_present
  prompt: 请旋入顶盖并拧紧
predicates:
  base_present: asm('base')
  column_present: asm('column')
  wheel_present: asm('wheel')
  cap_present: asm('cap')
fiducials:
  enabled: true
  marker_size_mm: 20.0
  positions:
  - - 12.0
    - 12.0
  - - 148.0
    - 12.0
  - - 148.0
    - 148.0
  - - 12.0
    - 148.0
ui:
  panel_ratio: 0.2
  video_fps: 30
  font_path: ''
  colors:
    ok:
    - 46
    - 125
    - 50
    warn:
    - 249
    - 168
    - 37
    error:
    - 198
    - 40
    - 40
    idle:
    - 97
    - 97
    - 97
