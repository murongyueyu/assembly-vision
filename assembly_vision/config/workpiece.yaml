workpiece: brass_shipwheel
name: 黄铜船用舵轮摆件
tray:
  size:
  - 160.0
  - 160.0
  thickness: 10.0
  pocket_depth: 2.0
  flip_x: false
  flip_y: false
slots:
- id: slot_wheel
  part: P3_wheel
  type: circle
  center:
  - 28.6
  - 49.5
  diameter: 75.0
  roi_margin_mm: 3.0
- id: slot_column
  part: P2_column
  type: capsule
  center:
  - 108.2
  - 43.7
  length: 91.0
  width: 28.0
  angle_deg: -44.0
  roi_margin_mm: 4.0
- id: slot_cap
  part: P4_cap
  type: circle
  center:
  - 28.0
  - 128.8
  diameter: 25.0
  roi_margin_mm: 3.0
- id: slot_base
  part: P1_base
  type: circle
  center:
  - 114.5
  - 129.4
  diameter: 65.0
  roi_margin_mm: 3.0
parts:
  P1_base:
    name: 底座圆盘
    expect: 1
  P2_column:
    name: 立柱
    expect: 1
  P3_wheel:
    name: 轮盘组件
    expect: 1
    spokes: 8
  P4_cap:
    name: 顶盖铭牌
    expect: 1
assembly:
  enabled: true
  center:
  - -65.0
  - 80.0
  radius: 45.0
  radii_mm:
    outer: 37.2
    spoke_band:
    - 12.0
    - 24.0
    spoke_band_outer:
    - 33.0
    - 37.5
    ring_band:
    - 26.0
    - 30.0
    hub: 13.0
    cap: 12.5
    center_plug: 6.0
  baseline:
    wheel_height_mm: null
    base_height_mm: 5.0
    spoke_peak_count: 8
    ring_coverage: null
    hub_coverage: null
  stereo_baseline_mm: 125.7
segment:
  background: green
  work_roi_margin_mm: 25.0
  brass:
    h_min: 10
    h_max: 45
    s_min: 50
    s_max: 180
    v_min: 80
    morph_open: 3
    morph_close: 5
    min_area_px: 500
  glove:
    h_min: 95
    h_max: 130
    s_min: 80
    v_min: 130
    morph_open: 3
    morph_close: 5
    min_area_px: 3000
    max_area_px: 200000
    max_aspect: 6.0
check:
  coverage_present: 0.45
  coverage_absent: 0.15
  coverage_scale_by_max: true
  drone_consistency: 2
  spokes:
    required: 8
    r_min_mm: 12.0
    r_max_mm: 24.0
    n_radii: 3
    peak_k_mad: 3.0
    min_peak_width_deg: 6.0
  column:
    aspect_min: 3.0
    min_length_mm: 40.0
    wheel_height_tol_mm: 15.0
  unsupported:
  - 顶盖是否拧紧（行程 1-2 mm，与深度噪声同量级）
  - 螺纹牙、小于 1 mm 的划痕与毛刺（受 GSD 限制）
  - 底座与工件内部结构（俯视不可见）
operations:
- id: op1
  name: 放置底座圆盘
  pre: []
  eff:
  - base_present
  prompt: 请将底座圆盘放入槽位并放上装配位
- id: op2
  name: 立柱旋入底座
  pre:
  - base_present
  eff:
  - column_present
  prompt: 请将立柱旋入底座中心孔
- id: op3
  name: 轮盘套上立柱
  pre:
  - column_present
  eff:
  - wheel_present
  prompt: 请将轮盘组件套到立柱上
- id: op4
  name: 顶盖旋入拧紧
  pre:
  - column_present
  - wheel_present
  eff:
  - cap_present
  prompt: 请旋入顶盖并拧紧
predicates:
  base_present: asm('base')
  column_present: asm('column')
  wheel_present: asm('wheel')
  cap_present: asm('cap')
fiducials:
  enabled: true
  marker_size_mm: 20.0
  positions:
  - - 12.0
    - 12.0
  - - 148.0
    - 12.0
  - - 148.0
    - 148.0
  - - 12.0
    - 148.0
ui:
  panel_ratio: 0.2
  video_fps: 30
  font_path: ''
  colors:
    ok:
    - 46
    - 125
    - 50
    warn:
    - 249
    - 168
    - 37
    error:
    - 198
    - 40
    - 40
    idle:
    - 97
    - 97
    - 97
