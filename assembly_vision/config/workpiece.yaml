# 工件定义：零件、料盘槽位、阈值、流程。
#
# ★ 坐标系约定（整个项目统一用这一套，避免后面搞混）
#    tray mm：以料盘左上角为原点，X 向右，Y 向下（图像式）。
#             料盘占据 X∈[0,160]，Y∈[0,160]。装配位在料盘下方，Y > 160。
#    标定出的单应 H 把 tray mm → 图像像素。
#
# ★ 槽位尺寸来自四个 STL 的反解结果（可信，不用再量）：
#    料盘 160x160x10，四槽中心在 40/120 网格上（间距 80），槽深 2 mm
#    立柱：斜圆头长槽 15.6 x 85.2，长轴 -45°
#    轮盘：Ø74.4    底座：Ø59.3    顶盖：Ø19.1


workpiece: brass_shipwheel
name: 黄铜船用舵轮摆件

tray:
  size: [160.0, 160.0]        # X, Y (mm)
  thickness: 10.0
  pocket_depth: 2.0
  # STL 的 Z 轴与 tray Y 轴的对应关系（摆反了就改这里，不用改槽位坐标）
  flip_x: false
  flip_y: false

# ── 槽位（tray mm）────────────────────────────────────────
# type: circle（直径）/ capsule（长圆槽：长、宽、倾角）
slots:
  # ══════════════════════════════════════════════════════════════════════
  # ★★ 槽位几何（2026-10 第二次修正）
  #
  # 第一版修正：用 c3 单应把空料盘正交化后做凹陷检测，得到槽的形状与尺寸。
  # 第二版（本次）：**中心改用零件的实际质心**，理由：
  #   · 实测发现料盘在 c3 标定之后被移动过约 18mm
  #     （相机没动 —— 绿幕质心只差 3.8px，料盘暗区中心差了 18px），
  #     所以"从空料盘反推的坐标"和"零件实际所在位置"差了近 20mm。
  #   · 零件就在槽里，**零件的质心就是最可靠的槽心**，比从凹陷反推更准。
  #   · 四类零件的质心构成一个规整矩形（x 间距 80.5、y 间距 78.7mm），
  #     互相印证，说明测的是对的。
  #
  # ★ 形状与尺寸沿用第一版的实测值（那道测量本身是有效的）。
  # ★ 料盘被移动/旋转时，运行时由 `tray_pose.estimate_pose()` 用零件星座
  #   自动补偿，**不需要重标**（见 assemvision/core/tray_pose.py）。
  # ══════════════════════════════════════════════════════════════════════

  # 左上：轮盘组件（大圆槽）
  - id: slot_wheel
    part: P3_wheel
    type: circle
    center: [24.0, 53.0]      # ★ 实测零件质心
    diameter: 75.0
    roi_margin_mm: 3.0

  # 右上：立柱（对角胶囊槽）
  - id: slot_column
    part: P2_column
    type: capsule
    center: [105.0, 54.0]     # ★ 实测零件质心
    length: 91.0
    width: 28.0
    angle_deg: -44.0
    roi_margin_mm: 4.0

  # 左下：顶盖铭牌（小圆槽）
  - id: slot_cap
    part: P4_cap
    type: circle
    center: [22.0, 132.0]     # ★ 实测零件质心
    diameter: 25.0
    roi_margin_mm: 3.0

  # 右下：底座圆盘（大圆槽）
  - id: slot_base
    part: P1_base
    type: circle
    center: [105.0, 130.0]    # ★ 实测零件质心
    diameter: 65.0
    roi_margin_mm: 3.0

# ── 零件 ───────────────────────────────────────────────────
parts:
  P1_base:   {name: 底座圆盘, expect: 1}
  P2_column: {name: 立柱,     expect: 1}
  P3_wheel:  {name: 轮盘组件, expect: 1, spokes: 8}    # ★ 辐条数是重点指标
  P4_cap:    {name: 顶盖铭牌, expect: 1}

# ── 装配位（tray mm）───────────────────────────────────────
# ★★ 位置实测选定：**料盘左侧 (-65, 80)**
#
# 为什么是左侧而不是"料盘下方"（原估算 [80, 250]）：
#   · **设备夹在桌子右侧，工人实际在左侧工作** —— 装配位放左侧才顺手。
#   · 视野约束：实测本机视野在 tray-mm 里是 x[-312, 280] y[-182, 251]。
#     料盘占 x[0,160] y[0,160]，所以各方向余量：
#         左 312mm   右 120mm   上 182mm   **下只有 91mm**
#     装配位要放 Ø90 成品（半径 45），**下方放不下** ——
#     原配置 [80, 250] 的圆有 **55% 落在画面外**（圆心都贴到画面底边了）。
#   · 实测三个候选的"圆内绿幕占比"都是 100%，差别只在离画面边缘的余量。
#
# ★ 装配位在 tray-mm 坐标系里定义，所以会**跟着料盘位姿补偿一起动** ——
#   料盘被挪动/旋转时，装配位坐标自动跟着修正（两者相对关系不变）。
#   前提：装配位与料盘在同一张绿垫上、相对位置固定。
assembly:
  enabled: true
  center: [-65.0, 80.0]       # ★ 实测选定：料盘左侧（工人操作侧）
  radius: 45.0                # 装配位 ROI 半径（成品俯视外接 = 轮盘 Ø74.4）
  # 判据用的几个半径（mm，相对装配中心）
  radii_mm:
    outer: 37.2               # 轮盘最大外接半径 Ø74.4 / 2
    # ★ 数辐条有两个完全不同的环带，不能混用：
    spoke_band: [12.0, 24.0]
    #   料盘上（轮盘平放在槽里）：取"辐条臂"，臂与臂之间是黑底，对比最强
    spoke_band_outer: [33.0, 37.5]
    #   装配体上：臂之间的空隙里看到的是下方的底座圆盘（也是黄铜！），
    #   所以臂的位置根本没有对比度，只能靠"球头端伸出外圈的凸起"来数。
    ring_band: [26.0, 30.0]   # 外圈环带（判外圈有没有装）
    hub: 13.0                 # 中心轮毂半径
    # ★ 顶盖半径：原来写 9.55（Ø19.1），与 slots.slot_cap.diameter=25 **自相矛盾**。
    #   实测支持 25：c6 特征标定量出顶盖 area=555mm²，反推 **Ø26.6mm**
    #   （真实值含透视投影 + 分割侵蚀会略小于名义值，所以名义约 Ø25 合理）。
    #   -> 取 12.5（Ø25），与槽位一致。
    cap: 12.5                 # 顶盖半径 Ø25（实测 Ø26.6，见 AGENTS.md 2.8b）
    center_plug: 6.0          # 判立柱：底座中心孔被堵住即视为立柱在位
  baseline:
    wheel_height_mm: null     # 由 c5_assembly_baseline.py 标定后自动写入
    base_height_mm: 5.0       # 只装底座时装配位中心的高度（用于深度判立柱）
    spoke_peak_count: 8
    ring_coverage: null
    hub_coverage: null
  # ── 相机基线（用用户自备的双目标定脚本实测）───────────────
  # ★ 实测：T = [-124.97, 13.37, -9.20] mm  ->  |T| = 125.7 mm
  #   与方案文档写的 120mm 接近，可信。R ≈ 单位矩阵（两镜头几乎平行）。
  # ★ 深度精度由基线决定：dZ = Z²/(fx·B)·σ
  #     fx = 360/0.868 = 414.7 px   （由 c1 的 GSD 反推，与理论值吻合）
  #     σ  = 1.096 px               （该次标定的重投影 RMS）
  #     -> 深度误差 ±2.73 mm；立柱判据阈值 15mm -> **余量 5.5 倍** ✓
  #   结论：立柱判据（深度唯一用途）在实测参数下完全可行。
  stereo_baseline_mm: 125.7

# ── 分割阈值 ───────────────────────────────────────────────
# ★ 黑色料盘推荐值；白色料盘见 SEGMENT_WHITE 注释
segment:
  background: green           # black | green —— 实际工位铺绿幕（★ 实测）
  # ★★ 工位全局 ROI：黄铜**只在「料盘 + 装配位」外扩这么多 mm 的范围内**检测。
  #
  # 为什么必须有（实测踩过）：木桌的 HSV 与黄铜重叠（桌面 S 中值 67~87，
  # 黄铜 S 区间 52~109）。实测某帧里**画面顶部的木桌整块被判成黄铜**，
  # 产生一个 **13269mm²** 的假连通域（真零件最大才 3281mm²），
  # 把零件识别和面积测量全带偏（顶盖面积被测成 1503 而非 555）。
  #
  # 为什么不用调阈值：单独收紧 h_max/s_max 会削掉零件自己的高光
  # （实测零件 S 上限 109、H 上限 45，与桌面区间本就重叠）——按下葫芦起瓢。
  # ROI 是**位置即身份**，与颜色、光照都无关，稳得多。
  #
  # 为什么不用"按固定比例裁掉上下 15%"：可行但**余量太薄** ——
  # 实测料盘底沿到画面 y=376px，而"中间 70%"只到 408px，差 32px；
  # 料盘稍微往下挪一点就被切掉。ROI 外扩 25mm（≈29px）且有位姿补偿跟着动。
  #
  # 取 25mm 的依据：料盘是放在桌上的，实测挪动量级 0~85mm 但**位姿补偿会跟上**；
  # 25mm 只用来兜住"补偿没跟上的那一两帧"和零件被手碰偏的量。
  # 设 0 或删掉此键 -> 关闭 ROI（退回全画面检测，木桌会被误判）。
  work_roi_margin_mm: 25.0
  brass:                      # 黄铜；HSV，OpenCV 范围 H∈[0,179] S,V∈[0,255]
    h_min: 10
    h_max: 45
    # ★ s_max 挡绿幕：实测黄铜 S 中值 87，绿幕 S 中值 255。
    #   ★ 但不能取太小：实测四类零件自身的 S 分布是 [52, 109]（高光/氧化处会掉到 53），
    #     取 110 会削掉零件自己的高光。取 180 对绿幕仍有 75 的余量，且完全不影响零件。
    # ★ s_min 由 60 降到 50：实测发现**镜面高光会去饱和**。
    #   在 slot_base ROI 内，V>200 的高光像素有 1874 个，其 S 中值只有 **20**（范围 [4,59]），
    #   全部被 s_min=60 拒掉 -> 覆盖率被压到 0.37（实际有件）。
    #   降到 50 后 base 覆盖率 0.37 -> 0.49，而**空料盘四个槽仍是 0.00**（不会误判有件）。
    #   注意：不要为了补救而把 s_min 降太多，也不要同时放宽 h_max ——
    #   实测 h_max=65 时空料盘开始出现 0.04~0.05 的假覆盖率，h_max=70 就崩到 0.41~0.86。
    s_min: 50
    s_max: 180
    v_min: 80                 # ★ 黑底靠这条挡掉暗部色偏；绿幕下保持 80 即可（实测只砍掉 3.4% 金属像素）
    morph_open: 3             # 形态学开运算核尺寸（去噪点）
    morph_close: 5            # 闭运算核尺寸（★ 补金属高光空洞）
    # ★ 实测：原木色桌面与手臂肤色的 S 中值 67~87，与零件的 60~109 完全重叠，
    #   **单靠 HSV 阈值切不干净**（这类假块在图一里有 17883/8443/7937/5740 px）。
    #   500 只能滤掉小的；根子上的解法是「黄铜只在托盘+装配位这个全局 ROI 内检测」
    #   （位置即身份，与 D3 一致）。见 README 第六节 6.4。
    min_area_px: 500
  glove:                      # 蓝色手套
    h_min: 95
    h_max: 130
    s_min: 80
    # ★ 实测本工位的死穴：笔记本蓝色键盘背光/屏幕 H 91~104、V 81~148，
    #   与手套（H 92~99、V 91~255）色相完全重叠，色相分不开。
    #   只能靠 V 下限区分。实测扫描（真手套 vs 空场景最大蓝块）：
    #     v_min=110 -> 83316 / 7882      v_min=130 -> 79638 / 1230
    #     v_min=150 -> 78725 /  774      v_min=190 -> 78022 /  368
    #   取 130：真手套几乎不损失（-4%），误报块降到 min_area(3000) 以下，被闸门滤掉。
    v_min: 130
    morph_open: 3
    morph_close: 5
    min_area_px: 3000
    max_area_px: 200000
    max_aspect: 6.0

# ── 合格性 / 齐套性判据 ────────────────────────────────────
check:
  # 槽与零件几乎贴合 → 有件≈100%、无件≈0%，阈值可以取得很宽
  coverage_present: 0.45      # ★ 覆盖率高于此值判「有件」
  coverage_absent: 0.15       # 低于此值判「缺件」；之间判「存疑」
  # ★★ 上面两个阈值会**按槽缩放**（见 part_id.max_coverage_for）。
  #   原因：覆盖率 = 零件面积 / 槽面积，这个比值**每种零件天生不同**：
  #     轮盘/底座/顶盖 ~0.95+（圆件填满圆槽）
  #     立柱只有 ~0.51（85x15 的细杆 vs 91x28 的宽胶囊槽）
  #   用统一阈值卡，立柱完整在位也只有 0.40 -> 必然误判「存疑」（实测踩过）。
  #   缩放后立柱阈值 ≈ 0.45x0.85 = 0.38，完整在位稳过。
  #   设 false 可退回"全局一刀切"的老行为（不推荐）。
  coverage_scale_by_max: true
  drone_consistency: 2        # 连续 N 帧一致才输出
  # 辐条计数（重点指标）
  spokes:
    required: 8
    # ★ 环带必须落在「辐条臂」上，避开外圈！
    #   外圈是一整圈金属，一旦混进环带，就把曲线的"背景"一侧整体抬高，
    #   自适应阈值会被推到 1.0 以上，什么都数不出来。
    #   下面这组值由 calib/c5_assembly_baseline.py 自动扫优后覆写。
    r_min_mm: 12.0            # 相对轮盘中心；毂之外、外圈之内
    r_max_mm: 24.0
    n_radii: 3                # 多半径投票
    peak_k_mad: 3.0           # 高于 中值 + k×MAD 才算「有辐条」
    min_peak_width_deg: 6.0   # 峰宽下限，滤掉毛刺
  # 立柱：装配中可见时用 2D，终检时用轮盘高度
  column:
    aspect_min: 3.0           # 细长比下限
    min_length_mm: 40.0
    wheel_height_tol_mm: 15.0 # ★ 深度噪声 1.5-2mm，余量足够
  # 明确不做判定的项（写进技术文件的能力边界）
  unsupported:
    - 顶盖是否拧紧（行程 1-2 mm，与深度噪声同量级）
    - 螺纹牙、小于 1 mm 的划痕与毛刺（受 GSD 限制）
    - 底座与工件内部结构（俯视不可见）

# ── 流程（前置条件表；pre 集合表达约束）──────────────────
# pre 里同时要求 column_present 与 wheel_present，就是你说的
# 「顶盖必须等立柱和轮盘都放好才能固定」
operations:
  - {id: op1, name: 放置底座圆盘,   pre: [],                             eff: [base_present],   prompt: 请将底座圆盘放入槽位并放上装配位}
  - {id: op2, name: 立柱旋入底座,   pre: [base_present],                  eff: [column_present], prompt: 请将立柱旋入底座中心孔}
  - {id: op3, name: 轮盘套上立柱,   pre: [column_present],                eff: [wheel_present],  prompt: 请将轮盘组件套到立柱上}
  - {id: op4, name: 顶盖旋入拧紧,   pre: [column_present, wheel_present], eff: [cap_present],    prompt: 请旋入顶盖并拧紧}

predicates:
  # ★ 谓词必须判「装配位上有没有」，不是「料盘槽里有没有」。
  #   零件被拿走正是为了装上去，判料盘必然永远等不到下一步。
  base_present:   "asm('base')"
  column_present: "asm('column')"
  wheel_present:  "asm('wheel')"
  cap_present:    "asm('cap')"

# ── 位姿自检标记（tray mm，四角）───────────────────────────
fiducials:
  enabled: true
  marker_size_mm: 20.0
  positions:                  # 标记中心（tray mm）
    - [12.0, 12.0]
    - [148.0, 12.0]
    - [148.0, 148.0]
    - [12.0, 148.0]

# ── 界面 ───────────────────────────────────────────────────
ui:
  panel_ratio: 0.20           # 右侧面板占屏宽比例
  video_fps: 30
  font_path: ""               # ★ 中文字体路径；留空则自动探测常见路径
  colors:
    ok:    [46, 125, 50]
    warn:  [249, 168, 37]
    error: [198, 40, 40]
    idle:  [97, 97, 97]
