# 相机与采集参数。所有"必须实测确认"的项都标了 ★。

# ── 图像来源 ────────────────────────────────────────────────
#   d435   ★ Intel RealSense D435（2026-10 换机后的正式相机；走 pyrealsense2）
#   uvc    旧相机 HBV-1714-2（走 cv2.VideoCapture + dshow，留档可回退）
#   video  单个视频文件（离线调试；若视频是左右拼接的就设 mode）
#   images 图片目录（离线调试）
source: d435

device: 0                     # uvc 专用（D435 走 SDK，不用索引；多台用 realsense.serial）
path: ""                      # source=video/images 时用

# ── Intel RealSense D435（source: d435）──────────────────────
# ★★ 两条硬约束，都是实测出来的（docs/踩坑实录.md §2.30 / §2.31）：
#   ① **必须走 pyrealsense2** —— cv2.VideoCapture 按索引枚举不到 D435；
#   ② **必须插 USB 3 口** —— USB 2.1 链路上连 424x240@6 都拿不到一帧
#      （不是带宽不够，是链路根本不工作）。开流时会读 usb_type_descriptor 自检，
#      不是 3.x 会直接大声报警，别去调分辨率。
realsense:
  # ★★ 2026-10 真机实测（`python tools/probe_d435.py`，相机对着桌面）：
  #   ┌─────────────┬────────┬────────┬──────────┬───────────────┬───────┐
  #   │ 模式         │ 实测fps│ fx     │ GSD@360mm│ 覆盖@360mm     │ 过曝   │
  #   ├─────────────┼────────┼────────┼──────────┼───────────────┼───────┤
  #   │ 640x480@30  │  30.0  │ 603.8  │  0.596   │ 382 x 286 mm  │ 1.60% │
  #   │ 1280x720@30 │  30.0  │ 905.7  │  0.397   │ 509 x 286 mm  │ 1.20% │
  #   └─────────────┴────────┴────────┴──────────┴───────────────┴───────┘
  # ★★ 纠正一处推算错误：早先文档写「640x480 -> GSD 0.795」是**拿 720p 的内参
  #   等比外推**得来的，**实测是 0.596**。D435 的 640x480 是**裁切模式**
  #   （水平 FOV 55.9°，比 720p 的 70.5° 窄），两个模式的内参不是一回事 ——
  #   **每换一个分辨率都要重新读内参、重跑 c1/c3**，不能按像素数等比换算。
  # ★ 选哪个模式**仍未最终定**，两条路的实测依据：
  #     640x480  视野窄（382mm）但每帧像素少 3 倍 —— 先按它换机，与 HBV 的 0.8623 同量级
  #     1280x720 视野宽（509mm）且 GSD 好 1.5 倍，帧率一样（30/60 都能开）
  #   ⇒ 到工位先量「料盘 + 装配位」要占多宽：超过 382mm 就必须用 1280x720。
  width: 640
  height: 480
  fps: 30                     # ★ 实测纯读帧 30.0fps；60fps 也真的能开（规格表没列全）
  serial: ""                  # 多台相机时按序列号选（本机 D435 = 262322070302）
  timeout_ms: 1000            # 等一帧的上限；掉线时好让上层快点发现
  open_retries: 3             # ★ 刚插拔会抛 Mutex_TotalFailure，重试即可（实录 §2.31）
  retry_wait_s: 1.5
  # ★ 相机选项。**工位标定值还没有，所以先留空** = 用相机自己的自动曝光
  #   （画面能看，但 HSV 阈值会随光照漂）。
  #   ★ 实测（对着桌面、自动曝光）：过曝 **1.20~1.60%**，已超工程 0.5% 的报警线
  #     —— 到工位必须重扫曝光，判据是「过曝 ≈0%」。
  #   在工位跑 用户存档/d435_site_report.py，把过曝调到 ≈0% 后再照下面填：
  #     controls:
  #       enable_auto_exposure: 0      # ★ 必须先关自动，否则下面的值白给
  #       exposure: 850                # ★ 量纲约 1~10000 —— 不是 DSHOW 的 -6.0！
  #       enable_auto_white_balance: 0
  #       white_balance: 4600
  #       gain: 16
  controls: {}

capture:
  # ★★ 本节是 **HBV-1714-2（source: uvc）口径**。换成 D435 后：
  #   · 分辨率/帧率改由上面的 `realsense:` 决定（这里的 width/height/fps 不再生效）；
  #   · backend / fourcc / mode / left_index / decoder 都是 UVC 专用，D435 用不到；
  #   · **仍然生效**的是 warmup_frames（pipeline 读它做预热）。
  #   留着是为了"换回 HBV 时不用重新查一遍"。
  # ★ 后端：Windows 必须 dshow。实测本机 OpenCV 4.12：
  #     VideoCapture(0, CAP_V4L2)  -> isOpened()=False   （V4L2 是 Linux 专用）
  #     VideoCapture(0, CAP_DSHOW) -> isOpened()=True
  #   Linux（树莓派）上改回 v4l2 即可；代码会按平台自动取 backend_windows 覆盖。
  backend: dshow              # v4l2(Linux) | dshow(Windows) | msmf | any
  backend_windows: dshow      # Windows 上覆盖用
  fourcc: MJPG                # ★ 必须是 MJPG，YUY2 只有 5~10fps
  # ★ 实测（tools/probe_camera.py，本机 OpenCV 4.12 + DSHOW）：
  #   ┌────────────┬──────────┬──────────────┬─────────────────┐
  #   │ 请求        │ 实际      │ 帧率          │ 是否真双目        │
  #   ├────────────┼──────────┼──────────────┼─────────────────┤
  #   │ 2560x960   │ 2560x960 │  4.5 fps     │ 真双目 1280x960/眼│
  #   │ 2560x720   │ 2560x720 │  4.5 fps     │ 真双目 1280x720/眼│
  #   │ 1920x720   │ 1280x720 │ 48.7 fps     │ 真双目  640x720/眼│
  #   │ 1280x720   │ 1280x720 │ 48.7 fps     │ 真双目  640x720/眼│
  #   │ 1280x960   │ 1280x960 │ 49.7 fps     │ ✗ 单眼画面，不是拼接│
  #   │  960x960   │  960x960 │  1.0 fps     │ ✗ 单眼画面         │
  #   └────────────┴──────────┴──────────────┴─────────────────┘
  # ★ 结论：**只有 2560 宽的模式才是逐眼高分辨率**（1280x960/眼）。
  #   1280 宽的模式虽然快（49fps）但单眼只有 640x720，且 1280x960 根本不是拼接图。
  #   2560 宽只有 4.5 fps —— 这是 USB 2.0 带宽上限（2560x960@60fps 需要约 147 MB/s，
  #   远超 USB2 的 ~40 MB/s）。★ 优先换 USB 3.0 口 + 短线再复测，帧率可能大幅提升。
  #
  # ★★ 实测结论（同一场景、相机不动，逐模式对比【左眼】能不能看全料盘）：
  #   ┌────────────┬─────────┬──────────────────────┬──────────────────┐
  #   │ 请求        │ 单眼     │ 左眼里的料盘           │ 结论              │
  #   ├────────────┼─────────┼──────────────────────┼──────────────────┤
  #   │ 1280x480   │ 640x480 │ 177x178 px（占宽28%）  │ ✅ 完整，采用      │
  #   │ 1280x960   │ 640x960 │ 301x314 px（占宽47%）  │ ❌ 贴右边缘，被切   │
  #   │ 2560x960   │1280x960 │ 数字放大，最糊          │ ❌ 不用            │
  #   └────────────┴─────────┴──────────────────────┴──────────────────┘
  # ★★ 为什么必须用左眼判断：**算法全程只用左眼**
  #   （分割、槽位覆盖率、辐条计数都在 f.left 上做）。左眼看不全工件 = 整套算法失效。
  # ★ 这也印证了 predict.py 一直用 1280x480 是对的。
  # ★ 另外 1280x960 / 2560x960 的两个"高分辨率"模式，实测都不是真高分辨率
  #   （2560x960 是数字放大；1280x960 虽非放大但视场窄到放不下工件）。
  width: 1280                 # ★ HBV 专用：1280x480 = 左右眼各 640x480（side_by_side）
  height: 480                 #   D435 的分辨率写在上面 `realsense.width/height`
  # ★ 低帧率下"连续 N 帧"的去抖会变得很迟滞，所以这里写实测帧率：
  #   pipeline 见到 <10fps 会自动把去抖切成按时间（Debouncer 的 hold_s）。
  #   ★ D435 实测 30.0fps（60fps 也能开）—— 这个数只在 <10 时才起作用。
  frame_rate_hint: 30
  fps: 30
  mode: side_by_side          # side_by_side（左右并排）| top_bottom（上下堆叠）
  left_index: 0               # 0 = 左眼在左/上；1 = 左眼在右/下
  # ★ 降采样解码：reduced2 需要 V4L2 裸流（尚未实现，见 sources/uvc_stereo.py 的 TODO）
  decoder: full               # full | reduced2

# ── 开机自检要写入并校验的相机控件 ──────────────────────────
# ★★ 本节**只对 source: uvc（HBV）生效**（见 uvc_stereo.apply_locked_controls）。
#   D435 的控件在 `realsense.controls` —— 两边**量纲不同，值不能互抄**。
# ★ Linux：用 v4l2-ctl --list-ctrls 核对控件名再照抄。
# ★ Windows：走 cv2.VideoCapture.set()。实测本机驱动对 AUTO_EXPOSURE / AUTO_WB
#   返回 False（等于说"我不支持用这个属性控制"），所以 Windows 上**必须手工**
#   在相机工具里关掉自动曝光/自动白平衡。
# ★★ 实测踩坑：相机默认自动曝光在"桌面铺大面积白纸"的场景下会严重过曝 ——
#   实测灰度均值 244、66% 像素顶到 255、B/G 通道 97% 饱和，画面信息基本丢光。
#   这会连带把帧率拖死（编码器被高熵满幅画面压垮），实测从 48 fps 掉到 4.5 fps。
#   所以：**先调好曝光，再谈帧率和阈值。**
locked_controls:
  auto_exposure: 1            # 1 = 手动曝光（★ 必须锁，否则阈值会漂）
  exposure_absolute: 120      # ★ 需现场实测：目标 灰度均值 100~160、饱和像素 <2%
  gain: 30                    # ★ 增益尽量低，否则噪声抬高饱和度
  white_balance_automatic: 0  # ★ 必须锁白平衡
  white_balance_temperature: 4600
  # ★ Windows 下这些可能都返回 False（驱动不收），那就用 tools/live_preview.py
  #   的实时快捷键调，调好后把值记到上面，并在相机自带工具里固化。
  #
  # ★★ 实测（这台相机，Windows + DSHOW）—— 曝光是**最关键的设置**：
  #   EXPOSURE 有效范围是 **-11 ~ -1**（负数，越小越暗），实测：
  #       -2 及以上 -> mean 246  严重过曝（各通道削顶，画面发白、颜色失真发青）
  #       -5        -> mean 153  ★ 最佳
  #       -6        -> mean 107  ✓ 良好
  #       -8        -> mean  32  偏暗
  #       -11       -> mean   4  全黑
  #   ★ 注意：**只设 auto_exposure 不够**，必须同时给 exposure_absolute 一个值，
  #     否则自动曝光仍然把画面拉满（实测单独设 auto_exposure 画面毫无变化）。
  #   ★ AUTO_WB / WB_TEMPERATURE / GAIN 三个属性驱动都返回 False，软件控制不了；
  #     但只要曝光正确，白平衡实测是正常的（白参考 R/B = 0.95）。
exposure_windows:
  # ★ 采集/标定脚本会自动应用这组值（见 uvc_stereo.apply_locked_controls）
  # ★★ 同样**只对 source: uvc 生效**；D435 的曝光用 rs.option.exposure（约 1~10000），
  #    下面这些 DSHOW 负数**抄过去会把画面弄成全黑/全白**。
  #
  # ★★ 从 -5.0 改到 -6.0（实测踩过，后果极其隐蔽）：
  #   曝光过高时**不是"少切一点"，而是整条判据链静默失效**：
  #     过曝 -> 黄铜色相被推向绿/青 -> 被判成"绿垫" -> 从 metal 掩膜剔除
  #          -> 装配体上数辐条恒为 0 峰、brass 面积塌掉 -> c5 全部失败
  #   而界面上只是"看着亮一点"，完全看不出判据已废。
  #
  #   实测（当前工位光照，逐曝光扫描）：
  #     曝光    过曝%    V均值   brass总px   轮盘那块px
  #      -3    92.58     254        0            0
  #      -5     7.96     244     1308          626    <- 轮盘真值约 3200px，只剩 1/5
  #      -6     0.00     216     9619         3094    <- 正确
  #      -7     0.00     157     9897         3104
  #   判据：**过曝像素(近全白)必须 ≈0%**。现在 segment.detail 里会记
  #   `blown_ratio`，报警阈值取 0.5%。
  #
  #   ★ 这个值随**环境光**变：环境变亮就要往更负调。换工位/换时段必须重扫。
  exposure: -6.0
  auto_exposure_off: 0.25     # 0.25 = 手动（DSHOW 约定）

# ── 各通道的缩放 ────────────────────────────────────────────
scale:
  # ★★ 这个值决定"标定脚本显示给你的画面有多大"，踩过坑：
  #   0.5 会把单眼 640x960 缩成 320x480，标定窗口里料盘只有一半大，
  #   看起来像"视野被裁了 / 只显示了一小部分"，其实内容是全的、只是被缩小了。
  #   （对比：裸 VideoCapture 不给缩小，所以 predict.py 看起来是满的。）
  #   标定要点像素，必须尽量大 -> 取 1.0。
  #   算法实时通道若在树莓派上跑不动，可以再调回 0.5，但**标定时建议 1.0**。
  realtime: 1.0               # 实时/标定通道：不缩小，单眼 640x960 原样显示
  inspect: 1.0                # 抽检通道：原分辨率

# ── 离线源的行为 ────────────────────────────────────────────
video:
  loop: true
  pace: true                  # ★ 按 video.fps 实时播放；关掉会以几百帧/秒冲完，
                              #   逻辑线程只能看到随机帧，去抖与流程判断全部失效
  stereo: false               # ★ 离线素材是不是"双目拼接画面"？
                              #   false = 普通单眼视频/图片（默认，不拆分）
                              #   true  = 录下来的就是左右拼接画面，需要拆分
  fps: 15                     # 离线播放帧率
  start_frame: 0

# ── 低频深度 ────────────────────────────────────────────────
depth:
  # ★★ 换 D435 后**先关掉**（2026-10）：
  #   · D435 的深度由**相机固件**用出厂标定算好（比 SGBM 又快又准），
  #     但工程里的 depth.py 是"拿左右两张彩色图跑 SGBM"的口径 —— 两者不是一回事；
  #   · 本模块（相机接入层）只给彩色，right=None，所以 T5 会一直请求全分辨率帧
  #     却永远等不到右眼，纯粹白跑。
  #   ⇒ 把 D435 的深度接进 core/depth.py 属 **B 模块**，须另开对话。
  #     在那之前这里保持 false；等接好了再打开。
  enabled: false
  every_n_frames: 30          # 1 Hz 左右
  # ★ 匹配器：实测本工位必须用 sgbm。StereoBM 在料盘区只有 9% 有效像素、
  #   视差散布 75 px（纯噪声），会被下面的 min_valid_ratio 闸门整帧丢掉。
  matcher: sgbm               # sgbm（默认，推荐）| bm
  # ★★ work_scale 必须跟着"单眼分辨率 + 基线 + numDisparities"一起算，
  #   不能沿用旧值。曾经因为沿用了按 1280x960 设的 0.375，把 640x480 缩成 240x180，
  #   导致 SGBM 报错：
  #     width - (minDisparity + numDisparities) = -16  （输入图太小）
  #
  #   当前参数（单眼 640x480，基线 126mm，工作距离 360mm，fx=346）：
  #     360mm 处视差 = fx·B/Z = 346×126/360 ≈ 121 px
  #     -> 需要 numDisparities ≥ 160（128 只有 7px 余量，太紧）
  #     -> work_scale=0.5 时工作分辨率 320x240，约束 w-numDisp=160 > 2 ✓
  #        可行深度范围约 262 ~ 43000 mm，覆盖 360mm ✓
  work_scale: 0.5             # 320x240。SGBM 约 15~25ms，深度只跑 1Hz
  # ★ 由实测基线反推：360mm 处视差约 121px，取 160 留 30% 余量
  num_disparities: 160
  block_size: 5               # SGBM 用小窗：实测 bs=5 有效像素最多
  # ★ 实测 sgbm 整幅有效像素约 22%（bm 只有 7.8%）。闸门取 0.12 留余量：
  #   取 0.2 时一旦光照变化就会间歇性丢弃整帧深度，立柱判定会时有时无。
  min_valid_ratio: 0.12

# ── 位姿自检 ────────────────────────────────────────────────
pose_check:
  enabled: true
  every_n_frames: 15          # 约 0.5 s
  aruco_dict: DICT_4X4_50
  marker_ids: [0, 1, 2, 3]
  warn_px: 3.0                # 超过 → 自动补偿 ROI 并提示
  fail_px: 20.0               # 超过 → 报警并暂停判定
  min_markers: 3
